<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulseBoard — Enterprise analytics and team management dashboard" />
    <title>PulseBoard</title>
    <!--
      Theme flash prevention script.
      Runs synchronously before any CSS or React loads to apply the correct
      theme class to <html> immediately, preventing FOUC (flash of unstyled content).
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'pulseboard_theme';
        var stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch (_) {}

        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && (stored === 'system' || stored === null) && prefersDark);

        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } else {
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
